version: 2

# ============================================================================
# Canonical dimensions: one row per logical entity (squad, competition,
# season, fixture). Built nightly from staging. Most are materialized as
# tables for fast joins; bridge/denormalisation views (core_*_id_resolutions,
# core_fixture_details) stay views so they're always current.
# ============================================================================

models:

  - name: core_squads
    description: "One row per club / national team. Deduped across iterations; cafc_squad_id is a placeholder for impect_squad_id until squad identity resolution lands (sibling of plan §2.6 player matcher)."
    columns:
      - name: cafc_squad_id
        description: "Canonical squad surrogate. = impect_squad_id today; will become a stable identity later."
        tests: [unique, not_null]
      - name: impect_squad_id
        tests: [unique, not_null]
      - name: squad_name
        tests: [not_null]
      - name: squad_type
      - name: gender

  - name: core_competitions
    description: "One row per competition_id (e.g. EFL Championship). Deduped across seasons; keeps the most-recent name."
    columns:
      - name: cafc_competition_id
        tests: [unique, not_null]
      - name: impect_competition_id
        tests: [unique, not_null]
      - name: competition_name
        tests: [not_null]

  - name: core_seasons
    description: "One row per (competition_id, season). An IMPECT iteration corresponds exactly to one (competition, season) instance."
    columns:
      - name: cafc_season_id
        description: "Canonical season surrogate. = iteration_id today (IMPECT is sole source)."
        tests: [unique, not_null]
      - name: cafc_competition_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('core_competitions')
                field: cafc_competition_id
      - name: season_name
        tests: [not_null]

  - name: core_fixture_details
    description: "Denormalised fixture view: one row per canonical fixture, squad names/countries resolved, IMPECT match metadata joined in. Built for Phase 6 sub-project 4 as the CORE-native twin of app_compat/matches.sql (canonical column names, same join logic)."
    columns:
      - name: cafc_fixture_id
        tests: [unique, not_null]
      - name: source_fixture_id
        description: "Primary IMPECT match id. NULL for internal (manually-added) fixtures. Not strictly unique: ~114 rows (2026-09-27) share a source_fixture_id with another cafc_fixture_id (max fan-out 3) - a pre-existing duplication in FIXTURE_IDENTITIES this model inherits, not introduced by it; app_compat.matches has the identical issue, untested. Warn-severity test surfaces it without blocking builds."
        tests:
          - unique:
              config:
                severity: warn
      - name: home_squad_name
        description: "Scout's own entry for manually-added fixtures (FIXTURE_IDENTITIES.SOURCE_HOME_SQUAD_NAME), else the core_squads name. No not_null test: a residual of legacy free-text fixtures with no resolvable squad id can leave this NULL, matching app_compat.matches' existing behaviour — not an oversight."
      - name: away_squad_name
        description: "See home_squad_name."
      - name: data_source
        description: "'external' (has IMPECT identity) or 'internal' (manually-added)."
        tests: [not_null]

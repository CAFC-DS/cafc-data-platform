version: 2

# ============================================================================
# IMPECT_RAW source tables.
#
# These declarations let staging models reference {{ source('impect', 'players') }}
# instead of hard-coding CAFC_DB.IMPECT_RAW.PLAYERS. dbt then knows the source
# table is upstream of the staging view in the DAG, and `dbt source freshness`
# can flag stale extracts.
#
# Freshness is left off most tables for now because IMPECT_RAW tables don't
# carry a per-row loaded_at timestamp — they're full-replaced by the Python
# extractor. Adding a `_LOADED_AT` column to the loader is a planned follow-up
# (plan §2.6 orchestrator changes) at which point freshness can be uniform.
# ITERATIONS has LASTCHANGETIMESTAMP from IMPECT itself, so it's wired in
# below as an early example.
#
# Test-severity policy (set 2026-06-01 after the first full canonical build):
#   * The entity reference tables (PLAYERS/SQUADS/STADIUMS/COACHES) are loaded
#     once per (entity, iteration) appearance, so their ID is intentionally
#     NOT unique in raw — uniqueness is a canonical-dimension invariant
#     (enforced + passing on core_squads). A `unique` test on raw ID is
#     therefore mis-specified and has been removed (not_null is kept).
#   * Referential integrity on the bulk ITERATION_* fact tables is best-effort
#     in raw: the fact and dimension tables are populated by different loaders
#     at different times, so ~7% of fact rows reference squad/player/iteration
#     IDs not yet present in the dimension snapshots. The canonical layer
#     tolerates this by construction (INNER JOINs + the no_orphan_kpis test),
#     so those source relationship tests are downgraded to `severity: warn` —
#     they stay visible as a data-completeness signal without failing the run.
#     The CHAMPIONSHIP_* relationship tests stay at error severity because that
#     extract is internally complete.
# ============================================================================

sources:
  - name: impect
    description: "Raw IMPECT API extracts. Owned by python/extract/impect/. Full-replaced on every extractor run."
    database: CAFC_DB
    schema: IMPECT_RAW

    tables:

      # ----------------------------------------------------------------------
      # Reference / dimension tables (small, slowly changing).
      # ----------------------------------------------------------------------

      - name: COUNTRIES
        description: "ISO countries with IMPECT-side IDs. Used to resolve player and squad nationalities."
        columns:
          - name: ID
            description: "IMPECT country ID."
            tests: [unique, not_null]
          - name: NAME

      - name: ITERATIONS
        description: "Competition × season instances (e.g. 'EFL Championship 2025/26'). The COMPETITION.* columns are dot-named from JSON flattening and need to be quoted in SQL."
        config:
          freshness:
            warn_after: { count: 24, period: hour }
            error_after: { count: 72, period: hour }
          loaded_at_field: "TRY_TO_TIMESTAMP_NTZ(LASTCHANGETIMESTAMP)"
        columns:
          - name: ID
            tests: [unique, not_null]
          - name: SEASON
          - name: DATAVERSION
          - name: LASTCHANGETIMESTAMP
            description: "ISO timestamp string of last change in IMPECT. Cast to TIMESTAMP_NTZ in staging."
          - name: '"COMPETITION.ID"'
            description: "Dot-named column from JSON flattening; reference with double-quotes."
          - name: '"COMPETITION.NAME"'

      # PLAYERS/SQUADS/STADIUMS/COACHES: one row per (entity, iteration)
      # appearance — ID is intentionally non-unique in raw (see header). Only
      # not_null is tested here; uniqueness is enforced in the canonical dims.

      - name: SQUADS
        description: "Clubs and national teams as IMPECT knows them. Loaded per-iteration, so ID repeats across iterations."
        columns:
          - name: ID
            tests: [not_null]
          - name: NAME
          - name: COUNTRYID
          - name: TYPE
            description: "e.g. CLUB / NATIONAL_TEAM."

      - name: STADIUMS
        description: "IMPECT stadium reference. Loaded per-iteration, so ID repeats across iterations."
        columns:
          - name: ID
            tests: [not_null]

      - name: COACHES
        description: "IMPECT coach reference. Loaded per-iteration, so ID repeats across iterations."
        columns:
          - name: ID
            tests: [not_null]

      # ----------------------------------------------------------------------
      # Player and match tables.
      # ----------------------------------------------------------------------

      - name: PLAYERS
        description: "IMPECT players. The source-of-truth for new player identities arriving through the matcher in plan §2.6. Loaded per-iteration, so ID repeats across iterations; the matcher/canonical dim dedupe."
        columns:
          - name: ID
            description: "IMPECT player ID. EXTERNAL_ID for the identity matcher (SOURCE_SYSTEM='IMPECT')."
            tests: [not_null]
          - name: FIRSTNAME
          - name: LASTNAME
          - name: COMMONNAME
            description: "Used by the matcher together with BIRTHDATE for identity resolution."
          - name: BIRTHDATE
            description: "ISO date string; cast to DATE in staging."
          - name: COUNTRYIDS
            description: "VARIANT array of IMPECT country IDs. Expand to many rows in canonical dim if multi-nationality matters."
          - name: CURRENTSQUADID
            description: "FLOAT in raw because IMPECT serializes NULLs as NaN; staging casts to NUMBER."

      - name: EVENTS
        description: "IMPECT raw match events (one row per on-ball event), landed by load_match_events.py. Event-level data only exists from dataVersion V2 onward (season 21/22+ for most competitions, confirmed empirically 2026-07-24) -- pre-V2 matches simply have no rows here, not an extraction gap."
        columns:
          - name: MATCH_ID
            tests: [not_null]
          - name: EVENT_ID
            tests: [not_null]
          - name: PLAYER_ID
            description: "IMPECT player ID of the event's primary player. Nullable -- some event types (e.g. formation changes) carry no player."

      - name: MATCHES
        description: "IMPECT fixtures across all iterations. The MATCHDAY.* columns are dot-named from JSON flattening."
        columns:
          - name: ID
            tests: [unique, not_null]
          - name: ITERATIONID
            tests:
              - relationships:
                  arguments:
                    to: source('impect', 'ITERATIONS')
                    field: ID
          - name: HOMESQUADID
          - name: AWAYSQUADID
          - name: SCHEDULEDDATE
            description: "ISO timestamp string; cast to TIMESTAMP_NTZ in staging."
          - name: AVAILABLE
            description: "Whether IMPECT has computed KPIs for this match yet."

      # ----------------------------------------------------------------------
      # KPI fact tables — the big ones. Driven by championship-scoped extracts
      # today; will broaden when other competitions are pulled.
      # ----------------------------------------------------------------------

      - name: CHAMPIONSHIP_MATCH_INDEX
        description: "Index of championship matches that have been extracted (header rows)."

      - name: CHAMPIONSHIP_MATCH_INFO
        description: "Per-match metadata for the championship subset (1:1 with CHAMPIONSHIP_MATCH_INDEX)."

      - name: CHAMPIONSHIP_PLAYER_KPIS
        description: "Per-match per-player KPI values. The primary input to canonical CORE.PLAYER_FIXTURE_KPIS (plan §2.5)."
        columns:
          - name: MATCHID
            tests:
              - relationships:
                  arguments:
                    to: source('impect', 'MATCHES')
                    field: ID
          - name: PLAYERID
            tests:
              # severity:warn — raw IMPECT_RAW.PLAYERS is deliberately scoped to
              # the player-fact seasons (last ~3), but championship match data
              # spans more history, so ~298k championship KPI rows reference
              # players absent from the scoped raw dimension. This does NOT
              # affect the canonical layer: those players resolve through
              # CORE.PLAYER_IDENTITIES / CORE.PLAYERS (verified by no_orphan_kpis),
              # and core_player_fixture_kpis is complete. Warn keeps the gap
              # visible without failing the refresh.
              - relationships:
                  arguments:
                    to: source('impect', 'PLAYERS')
                    field: ID
                  config:
                    severity: warn
          - name: SQUADID
            tests:
              - relationships:
                  arguments:
                    to: source('impect', 'SQUADS')
                    field: ID
          - name: KPIID
            description: "FK to KPI definitions (will be a dbt seed in dbt/seeds/kpi_definitions.csv)."
          - name: VALUE

      - name: CHAMPIONSHIP_SQUAD_KPIS
        description: "Per-match per-squad KPI values. Aggregated counterpart to CHAMPIONSHIP_PLAYER_KPIS."
        columns:
          - name: MATCHID
            tests:
              - relationships:
                  arguments:
                    to: source('impect', 'MATCHES')
                    field: ID
          - name: SQUADID
            tests:
              - relationships:
                  arguments:
                    to: source('impect', 'SQUADS')
                    field: ID
          - name: KPIID
          - name: VALUE

      # ----------------------------------------------------------------------
      # Iteration-level (season aggregate) tables.
      # Populated by python/extract/impect/load_iteration_*.py across every
      # iteration in IMPECT_RAW.ITERATIONS. Already flat (one row per
      # (iteration, squad/player, kpi/score)) — no normalisation needed in
      # staging. Relationship tests are severity:warn — see header.
      # ----------------------------------------------------------------------

      - name: ITERATION_SQUAD_KPIS
        description: "Per-(iteration, squad, kpi) season-average KPI values across all iterations IMPECT exposes."
        columns:
          - name: ITERATION_ID
            tests:
              - relationships:
                  arguments:
                    to: source('impect', 'ITERATIONS')
                    field: ID
                  config:
                    severity: warn
          - name: SQUAD_ID
            tests:
              - relationships:
                  arguments:
                    to: source('impect', 'SQUADS')
                    field: ID
                  config:
                    severity: warn
          - name: KPI_ID
          - name: MATCHES
            description: "Number of matches the squad played in this iteration; denominator for any subsequent per-90 calculations."
          - name: VALUE

      - name: ITERATION_SQUAD_SCORES
        description: "Per-(iteration, squad, score) standardized squad scores from IMPECT. Not recomputable from match-level data — they're normalized against IMPECT's cross-league comparison population."
        columns:
          - name: ITERATION_ID
            tests:
              - relationships:
                  arguments:
                    to: source('impect', 'ITERATIONS')
                    field: ID
                  config:
                    severity: warn
          - name: SQUAD_ID
            tests:
              - relationships:
                  arguments:
                    to: source('impect', 'SQUADS')
                    field: ID
                  config:
                    severity: warn
          - name: SQUAD_SCORE_ID
          - name: MATCHES
          - name: VALUE
            description: "Normalized score (typically 0-1 percentile-style)."

      - name: ITERATION_PLAYER_KPIS
        description: "Per-(iteration, squad, player, kpi) season-average player KPIs. The primary input to canonical season-grain player models. ~107 rows per (iteration, squad) on average."
        columns:
          - name: ITERATION_ID
            tests:
              - relationships:
                  arguments:
                    to: source('impect', 'ITERATIONS')
                    field: ID
                  config:
                    severity: warn
          - name: SQUAD_ID
            tests:
              - relationships:
                  arguments:
                    to: source('impect', 'SQUADS')
                    field: ID
                  config:
                    severity: warn
          - name: PLAYER_ID
            tests:
              - relationships:
                  arguments:
                    to: source('impect', 'PLAYERS')
                    field: ID
                  config:
                    severity: warn
          - name: KPI_ID
          - name: POSITION
            description: "IMPECT position code, e.g. CENTRAL_DEFENDER, GOALKEEPER, LEFT_WINGBACK_DEFENDER. Used by the position-specific endpoints when they're wired up."
          - name: PLAY_DURATION
            description: "Total playing seconds the player accumulated in this (iteration, squad)."
          - name: MATCH_SHARE
            description: "Fraction of available match-time the player was on (proxy for 'minutes played as % of season')."
          - name: VALUE

      - name: ITERATION_PLAYER_SCORES
        description: "Per-(iteration, squad, player, playerScore) standardized player scores. Same un-recomputable property as ITERATION_SQUAD_SCORES — IMPECT's normalization population is the value-add."
        columns:
          - name: ITERATION_ID
            tests:
              - relationships:
                  arguments:
                    to: source('impect', 'ITERATIONS')
                    field: ID
                  config:
                    severity: warn
          - name: SQUAD_ID
            tests:
              - relationships:
                  arguments:
                    to: source('impect', 'SQUADS')
                    field: ID
                  config:
                    severity: warn
          - name: PLAYER_ID
            tests:
              - relationships:
                  arguments:
                    to: source('impect', 'PLAYERS')
                    field: ID
                  config:
                    severity: warn
          - name: PLAYER_SCORE_ID
          - name: POSITION
          - name: PLAY_DURATION
          - name: MATCH_SHARE
          - name: VALUE

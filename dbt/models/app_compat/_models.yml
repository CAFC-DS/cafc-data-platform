version: 2

# ============================================================================
# APP_COMPAT views — legacy-shape contract for the recruitment-platform app.
#
# Materialized as views (per dbt_project.yml) — always current, zero storage.
# Live in schema CAFC_DB.APP_COMPAT (prod) or CAFC_DB.APP_COMPAT_DEV_<user>
# (dev) via the generate_schema_name macro.
#
# These are the first two of ~20 legacy tables that need APP_COMPAT mirrors;
# see _README.md for the full list and prioritisation per plan Part 3.
# ============================================================================

models:

  - name: players_base
    description: "Legacy-shape player snapshot table (rebuilt per dbt run). Mirrors RECRUITMENT_TEST.PUBLIC.PLAYERS column-for-column, sourced from CORE.* via stg_impect__players + canonical bridges. App reads `players`, not this."
    columns:
      - name: PLAYERID
        description: "Legacy external player ID (IMPECT player ID today). Same as RECRUITMENT_TEST.PUBLIC.PLAYERS.PLAYERID."
      - name: CAFC_PLAYER_ID
        description: "Canonical surrogate, resolved through overrides + identities."
      - name: DATA_SOURCE
        description: "'external' (has IMPECT identity) or 'internal' (manual)."

  - name: players
    description: "App-facing player contract: players_base UNION a live tail of CORE.PLAYERS rows minted since the last dbt build (Phase 5 — the app mints manual players directly into CORE and must see them immediately)."
    columns:
      - name: CAFC_PLAYER_ID
        description: "Canonical surrogate; unique across base + tail by the anti-join."

  - name: matches
    description: "Legacy-shape match view. Mirrors RECRUITMENT_TEST.PUBLIC.MATCHES column-for-column. CAFC_MATCH_ID resolves through FIXTURE_IDENTITIES."
    columns:
      - name: ID
        description: "Legacy IMPECT match ID."
      - name: CAFC_MATCH_ID
        description: "Canonical surrogate (CAFC_FIXTURE_ID)."
      - name: DATA_SOURCE

  # --------------------------------------------------------------------------
  # App-owned legacy passthroughs (formalised from hand-built views 2026-06-01).
  # These mirror RECRUITMENT_TEST.PUBLIC.* (or CORE.USERS) verbatim — the app
  # writes them, dbt only bridges them until Part 3 cutover (docs/decisions/0001).
  # --------------------------------------------------------------------------

  - name: scout_reports
    description: "Scout reports, app-owned. Passthrough of the live RECRUITMENT_TEST.PUBLIC.SCOUT_REPORTS (already carries PLAYER_ID + CAFC_PLAYER_ID). Replaces the prior hand-built view that pointed at the dropped CORE.SCOUT_REPORTS_TEST."

  - name: scout_report_attribute_scores
    description: "Per-(scout report, attribute) scores. App-owned passthrough."

  - name: scout_report_views
    description: "Scout-report read-receipts. App-owned passthrough."

  - name: position_attributes
    description: "Per-position attribute catalogue. App-owned passthrough."

  - name: users
    description: "Application users, app-owned. Passthrough of CORE.USERS."

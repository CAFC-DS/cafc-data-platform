version: 2

# ============================================================================
# APP_COMPAT views — legacy-shape contract for the recruitment-platform app.
#
# Materialized as views (per dbt_project.yml) — always current, zero storage.
# Live in schema CAFC_DB.APP_COMPAT (prod) or CAFC_DB.APP_COMPAT_DEV_<user>
# (dev) via the generate_schema_name macro.
#
# These are the first two of ~20 legacy tables that need APP_COMPAT mirrors;
# see _README.md for the full list and prioritisation per plan Part 3.
# ============================================================================

models:

  - name: players_base
    description: "Legacy-shape player snapshot table (rebuilt per dbt run). Mirrors RECRUITMENT_TEST.PUBLIC.PLAYERS column-for-column, sourced from CORE.* via stg_impect__players + canonical bridges. App reads `players`, not this."
    columns:
      - name: PLAYERID
        description: "Legacy external player ID (IMPECT player ID today). Same as RECRUITMENT_TEST.PUBLIC.PLAYERS.PLAYERID."
      - name: CAFC_PLAYER_ID
        description: "Canonical surrogate, resolved through overrides + identities."
      - name: DATA_SOURCE
        description: "'external' (has IMPECT identity) or 'internal' (manual)."

  - name: players
    description: "App-facing player contract: players_base UNION a live tail of CORE.PLAYERS rows minted since the last dbt build (Phase 5 — the app mints manual players directly into CORE and must see them immediately)."
    columns:
      - name: CAFC_PLAYER_ID
        description: "Canonical surrogate; unique across base + tail by the anti-join."

  - name: matches
    description: "Legacy-shape match view. Mirrors RECRUITMENT_TEST.PUBLIC.MATCHES column-for-column. CAFC_MATCH_ID resolves through FIXTURE_IDENTITIES."
    columns:
      - name: ID
        description: "Legacy IMPECT match ID."
      - name: CAFC_MATCH_ID
        description: "Canonical surrogate (CAFC_FIXTURE_ID)."
      - name: DATA_SOURCE
        description: "'external' (IMPECT identity) or 'internal' (manually-added)."
      - name: HOMESQUADNAME
        description: "For internal fixtures: the scout's entered name (FIXTURE_IDENTITIES.SOURCE_HOME_SQUAD_NAME), else the core_squads name. For external: core_squads."
      - name: AWAYSQUADNAME
        description: "See HOMESQUADNAME."

  # --------------------------------------------------------------------------
  # App-owned legacy passthroughs (formalised from hand-built views 2026-06-01).
  # These mirror RECRUITMENT_TEST.PUBLIC.* (or CORE.USERS) verbatim — the app
  # writes them, dbt only bridges them until Part 3 cutover (docs/decisions/0001).
  # --------------------------------------------------------------------------

  - name: scout_reports
    description: "Scout reports, app-owned. Passthrough of the live RECRUITMENT_TEST.PUBLIC.SCOUT_REPORTS (already carries PLAYER_ID + CAFC_PLAYER_ID). Replaces the prior hand-built view that pointed at the dropped CORE.SCOUT_REPORTS_TEST."

  - name: scout_report_attribute_scores
    description: "Per-(scout report, attribute) scores. App-owned passthrough."

  - name: scout_report_views
    description: "Scout-report read-receipts. App-owned passthrough."

  - name: position_attributes
    description: "Per-position attribute catalogue. App-owned passthrough."

  - name: users
    description: "Application users, app-owned. Passthrough of CORE.USERS."

  - name: agent_profiles
    description: "Agent contact profiles. App-owned passthrough."
    columns:
      - name: USER_ID
        tests: [unique, not_null]

  - name: notifications
    description: "In-app user notifications. App-owned passthrough."
    columns:
      - name: ID
        tests: [unique, not_null]

  - name: password_reset_tokens
    description: "Single-use password reset tokens. App-owned passthrough."
    columns:
      - name: ID
        tests: [unique, not_null]

  - name: player_information
    description: "Supplementary per-player info captured in-app. App-owned; legacy carries only PLAYER_ID (IMPECT id), so this view ADDS CAFC_PLAYER_ID via the canonical resolution (not all rows resolve)."
    columns:
      - name: ID
        tests: [unique, not_null]

  - name: player_list_flags
    description: "Shared favourite/decision markers on a player, keyed by UNIVERSAL_ID text. App-owned passthrough."
    columns:
      - name: UNIVERSAL_ID
        tests: [unique, not_null]

  - name: player_list_items
    description: "Shortlist members. App-owned passthrough; carries PLAYER_ID + CAFC_PLAYER_ID, but CAFC_PLAYER_ID is NULL on ~2,850 rows (unresolved identity) as of 2026-09-18 — not the 100%-populated dual-id this view's original description implied."
    columns:
      - name: ID
        tests: [unique, not_null]

  - name: player_lists
    description: "User-defined player shortlists. App-owned passthrough."
    columns:
      - name: ID
        tests: [unique, not_null]

  - name: player_notes
    description: "Free-text player notes. App-owned; legacy carries only PLAYER_ID (IMPECT id), so this view ADDS CAFC_PLAYER_ID via the canonical resolution (not all rows resolve)."
    columns:
      - name: ID
        tests: [unique, not_null]

  - name: player_recommendations
    description: "Player recommendations workflow. App-owned passthrough."
    columns:
      - name: ID
        tests: [unique, not_null]

  - name: player_stage_history
    description: "Recruitment-stage transitions per player. App-owned; legacy carries only PLAYER_ID (IMPECT id), so this view ADDS CAFC_PLAYER_ID via the canonical resolution. ~99.6% of PLAYER_IDs resolve; the rest (manual/stale players) get a NULL CAFC_PLAYER_ID."
    columns:
      - name: ID
        tests: [unique, not_null]

  - name: recommendation_notes_history
    description: "Append-only history of notes left on a recommendation. App-owned passthrough."
    columns:
      - name: ID
        tests: [unique, not_null]

  - name: scout_assignments
    description: "Scout assignment headers. App-owned passthrough."
    columns:
      - name: ID
        tests: [unique, not_null]

  - name: scout_assignment_audit
    description: "Scout assignment audit trail. App-owned passthrough."
    columns:
      - name: ID
        tests: [unique, not_null]

  - name: scout_assignment_players
    description: "Players within a scout assignment. App-owned passthrough."
    columns:
      - name: ID
        tests: [unique, not_null]

  - name: shared_report_links
    description: "Shareable scout-report links. App-owned passthrough."
    columns:
      - name: ID
        tests: [unique, not_null]

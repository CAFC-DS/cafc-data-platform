version: 2

# ============================================================================
# Legacy recruitment-platform tables, exposed as dbt sources so the APP_COMPAT
# passthrough views can reference them with tracked dependencies.
#
# These tables live in RECRUITMENT_TEST.PUBLIC and are WRITTEN BY THE APP
# (scouts/managers using the platform) — dbt does not own or rebuild them
# (see docs/decisions/0001). They stay here until the Part 3 per-feature
# cutover; the APP_COMPAT views over them are the transition bridge.
#
# scout_reports already carries both PLAYER_ID (legacy) and CAFC_PLAYER_ID
# (canonical) at source, so its compat view needs no extra identity join.
# ============================================================================

sources:
  # Phase 3 (scout reports + lists) tables moved to CAFC_DB.CORE — their
  # canonical home — via snowflake/ddl/20260610_phase3_move_scout_lists_to_core.sql.
  # The app writes them there directly once CORE_DB_SCHEMA=CORE flips
  # (runbook: docs/runbooks/phase-3-cutover.md). Still not dbt-managed —
  # user-generated data, dbt only bridges shape.
  - name: core_app
    description: "App-owned tables in CAFC_DB.CORE (moved from RECRUITMENT_TEST.PUBLIC at Phase 3 cutover). Written by the recruitment app, not dbt."
    database: CAFC_DB
    schema: CORE

    tables:
      - name: SCOUT_REPORTS
        description: "Scout reports written in the app. Carries PLAYER_ID (legacy) + CAFC_PLAYER_ID (canonical)."
      - name: SCOUT_REPORT_ATTRIBUTE_SCORES
        description: "Per-(scout report, attribute) scores."
      - name: SCOUT_REPORT_VIEWS
        description: "Read-receipts: which user viewed which scout report when."
      - name: PLAYER_LISTS
        description: "User-defined player shortlists."
      - name: PLAYER_LIST_ITEMS
        description: "Members of a shortlist. Carries PLAYER_ID + CAFC_PLAYER_ID."
      - name: POSITION_ATTRIBUTES
        description: "Per-position attribute catalogue used by scout-report scoring. App reads only."
      - name: SHARED_REPORT_LINKS
        description: "Shareable scout-report links."
      # Phase 4 moves (20260611_phase4_move_remaining_app_tables_to_core.sql) —
      # the rest of the app-owned tables, found missing a CORE home by the
      # 2026-06-11 cutover audit. USERS is re-cloned at cutover: the previous
      # CORE.USERS was a stale 51-row migration copy vs 174 live.
      - name: USERS
        description: "App users + auth + roles. Cloned fresh from legacy inside the cutover freeze."
      - name: PLAYER_NOTES
        description: "Free-text notes on a player. Legacy PLAYER_ID only; view adds CAFC_PLAYER_ID."
      - name: PLAYER_INFORMATION
        description: "Supplementary per-player info captured in-app (intel). Legacy PLAYER_ID only; view adds CAFC_PLAYER_ID."
      - name: AGENT_PROFILES
        description: "Agent contact profiles."
      - name: PLAYER_RECOMMENDATIONS
        description: "Player recommendations workflow."
      - name: PLAYER_STAGE_HISTORY
        description: "Recruitment-stage transitions per player. Legacy PLAYER_ID only; view adds CAFC_PLAYER_ID."
      - name: STATUS_HISTORY
        description: "Generic status-change audit."

  - name: recruitment_legacy
    description: "Live app-owned tables in RECRUITMENT_TEST.PUBLIC. Written by the recruitment app, not dbt. Bridged into APP_COMPAT until each table's cutover phase moves it to CORE."
    database: RECRUITMENT_TEST
    schema: PUBLIC

    tables:
      - name: USERS
        description: "Live application users / auth (159). Authoritative over CORE.USERS (a stale 51-row migration copy)."

      # Player workflow tables (§1a). PLAYER_NOTES / PLAYER_STAGE_HISTORY /
      # PLAYER_INFORMATION carry only legacy PLAYER_ID and get CAFC_PLAYER_ID
      # added in their views. (Scout reports + lists tables moved to the
      # core_app source above at Phase 3.)
      - name: PLAYER_NOTES
        description: "Free-text notes on a player. Legacy PLAYER_ID only."
      - name: PLAYER_RECOMMENDATIONS
        description: "Player recommendations workflow."
      - name: PLAYER_STAGE_HISTORY
        description: "Recruitment-stage transitions per player. Legacy PLAYER_ID only."
      - name: PLAYER_INFORMATION
        description: "Supplementary per-player info captured in-app. Legacy PLAYER_ID only."
      - name: AGENT_PROFILES
        description: "Agent contact profiles."
      - name: NOTIFICATIONS
        description: "In-app user notifications."
      - name: STATUS_HISTORY
        description: "Generic status-change audit."
      - name: SCOUT_ASSIGNMENTS
        description: "Scout assignment headers."
      - name: SCOUT_ASSIGNMENT_AUDIT
        description: "Scout assignment audit trail."
      - name: SCOUT_ASSIGNMENT_PLAYERS
        description: "Players within a scout assignment."

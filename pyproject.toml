[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cafc-data-platform"
version = "0.0.1"
description = "CAFC canonical data platform — extract, identity, dbt"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0",
  "python-dotenv>=1.0.0",
  "snowflake-connector-python>=3.6.0",
  "pandas>=2.0.0",
  "cryptography>=42.0.0",
  "dbt-snowflake>=1.8,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[tool.setuptools]
py-modules = []

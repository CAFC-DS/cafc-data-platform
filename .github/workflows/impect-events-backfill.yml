name: Impect events backfill

# One-off/manual backfill of raw match events (IMPECT_RAW.EVENTS) for a
# given Impect iteration (competition-season). Defaults to iteration 1410
# (EFL Championship, 25/26 -- the only season currently in scope per the
# 2026-07-27 backfill request). Confirmed live that event-level data only
# exists from Impect's dataVersion V2 onward (~season 21/22+ for most
# competitions) -- run against an earlier iteration and it'll just report
# "no event data available" per match, harmlessly.
#
# Idempotent: load_match_events.py skips matches already present in
# IMPECT_RAW.EVENTS, so a re-run after a timeout/failure just resumes.

on:
  workflow_dispatch:
    inputs:
      iteration_id:
        description: "Impect iteration id to backfill (default: 1410 = EFL Championship 25/26)"
        required: false
        default: "1410"

jobs:
  impect-events-pull:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: python/extract/impect
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        working-directory: .
        run: pip install -e .

      - name: Write Snowflake private key
        env:
          SNOWFLAKE_PRIVATE_KEY_PEM: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          printf '%s' "$SNOWFLAKE_PRIVATE_KEY_PEM" > "$RUNNER_TEMP/snowflake_key.pem"
          chmod 600 "$RUNNER_TEMP/snowflake_key.pem"

      - name: Run Impect events backfill
        env:
          IMPECT_USERNAME: ${{ secrets.IMPECT_USERNAME }}
          IMPECT_PASSWORD: ${{ secrets.IMPECT_PASSWORD }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_DATABASE: CAFC_DB
        run: |
          export SNOWFLAKE_PRIVATE_KEY_PATH="$RUNNER_TEMP/snowflake_key.pem"
          python load_match_events.py --iteration-id "${{ github.event.inputs.iteration_id }}"

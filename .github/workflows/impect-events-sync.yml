name: IMPECT men's event sync

# Low-cost scheduled ingestion for every accessible non-women's competition.
# The Python job discovers iterations dynamically; it never embeds a season
# or competition id. GitHub Actions is used because this repository already
# stores credentials there and no always-on infrastructure is required.

on:
  schedule:
    # GitHub Actions cron is UTC. Trigger at both possible UTC hours and let
    # the first step continue only at 09:15 Europe/London (BST and GMT).
    - cron: "15 8,9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Discover eligible matches without writing event data"
        required: false
        default: false
        type: boolean

concurrency:
  group: impect-events
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: python/extract/impect
    steps:
      - name: Check London schedule
        id: london_time
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(TZ=Europe/London date +%H:%M)" = "09:15" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.london_time.outputs.run == 'true'
        uses: actions/checkout@v4

      - if: steps.london_time.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        if: steps.london_time.outputs.run == 'true'
        working-directory: .
        run: pip install -e .

      - name: Write Snowflake private key
        if: steps.london_time.outputs.run == 'true'
        env:
          SNOWFLAKE_PRIVATE_KEY_PEM: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          printf '%s' "$SNOWFLAKE_PRIVATE_KEY_PEM" > "$RUNNER_TEMP/snowflake_key.pem"
          chmod 600 "$RUNNER_TEMP/snowflake_key.pem"

      - name: Synchronise recent match events
        if: steps.london_time.outputs.run == 'true'
        env:
          IMPECT_USERNAME: ${{ secrets.IMPECT_USERNAME }}
          IMPECT_PASSWORD: ${{ secrets.IMPECT_PASSWORD }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_DATABASE: CAFC_DB
        run: |
          export SNOWFLAKE_PRIVATE_KEY_PATH="$RUNNER_TEMP/snowflake_key.pem"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python sync_recent_match_events.py --dry-run
          else
            python sync_recent_match_events.py
          fi
